# ISOMS on the DOK shared server. Run from the repository root (~/absismo-stack):
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
# Follows the DOK deployment rules: no host ports (expose only), the shared Nginx reaches only
# absismo-web and absismo-api, the database is on a private network and its data is on the data disk.

# Project name set explicitly: the folder is called deploy, which other stacks on the server may also use.
name: absismo

services:
  db:
    image: postgres:16-alpine
    container_name: absismo-db
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Sized to the 2 GB container limit below: shared_buffers ~25 percent, effective_cache_size ~75 percent.
    command: >
      postgres -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c work_mem=8MB
               -c max_connections=100
    volumes:
      - /mnt/disks/data/db/absismo:/var/lib/postgresql/data
    networks:
      - absismo-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
          pids: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates or updates the tables (schema only, no demo data), then exits.
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: absismo-api:latest
    container_name: absismo-migrate
    command: ["node", "server/db/migrate.js"]
    environment:
      NODE_ENV: production
      DB_HOST: absismo-db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - absismo-net
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 100
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: absismo-api:latest
    container_name: absismo-api
    restart: unless-stopped
    expose:
      - "5010"
    environment:
      NODE_ENV: production
      PORT: "5010"
      # One proxy (the shared Nginx) sits in front: without this the login limit would treat all users as one.
      TRUST_PROXY: "1"
      DB_HOST: absismo-db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://${ISOMS_DOMAIN}
      DOCS_ENABLED: ${DOCS_ENABLED:-true}
    networks:
      - absismo-net
      - shared-nginx
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
          pids: 200
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5010/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: https://${ISOMS_DOMAIN}/api
    image: absismo-web:latest
    container_name: absismo-web
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - shared-nginx
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 100
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost resolves to IPv6 first and Nginx listens on IPv4.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  absismo-net:
    name: absismo-app-net
  shared-nginx:
    name: shared-nginx
    external: true
