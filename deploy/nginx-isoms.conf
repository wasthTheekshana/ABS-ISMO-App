# ISOMS server blocks for the shared Nginx.
# Paste into ~/dok-stack/nginx/nginx.conf before the default catch-all.
# /api goes to the API container, everything else to the web container, both over the shared-nginx network.

# absismo - HTTP redirect
server {
    listen 80;
    server_name ismo.testsys.shop;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# absismo - HTTPS
server {
    listen 443 ssl;
    server_name ismo.testsys.shop;
    ssl_certificate     /etc/letsencrypt/live/testsys.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/testsys.shop/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # The API accepts JSON bodies up to 5 MB (incident reports with photos).
    client_max_body_size 6m;

    location ~ /\.env { deny all; return 404; }

    # No trailing slash on proxy_pass: the API routes already start with /api.
    location /api/ {
        proxy_pass         http://absismo-api:5010;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass         http://absismo-web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
    }
}
