# Serves the built web app inside the isoms-web container (the shared Nginx proxies to it).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx drops server-level headers in a location that sets its own, so the three security
    # headers are repeated in every location below.

    # Hashed build files never change, so browsers may keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # index.html must always be re-checked so a new release is picked up straight away.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}
